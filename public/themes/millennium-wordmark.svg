<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Millénaire de Guillaume le Conquérant, 1027 à 2027">
  <title>Millénaire de Guillaume le Conquérant — 1027 · 2027</title>
  <g transform="translate(4 4) scale(0.59375)">
